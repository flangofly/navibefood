<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Na Vibe — Admin</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Na Vibe Admin">
<link rel="apple-touch-icon" href="admin-icon-180.png">
<style>
:root{--green:#79d51a;--black:#111;--paper:#f4f4f1;--muted:#777;--red:#c62828;--orange:#ef8b17}
*{box-sizing:border-box}
html{background:#111}
body{margin:0;background:var(--paper);color:#111;font-family:Arial,Helvetica,sans-serif;min-height:100vh;padding-bottom:95px}
header{background:#111;color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 16px;position:sticky;top:0;z-index:20;box-shadow:0 3px 18px #0004}
.head{max-width:820px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-weight:900;font-style:italic;font-size:29px} .logo b{color:var(--green)}
.admin{font-size:11px;font-weight:900;padding:7px 10px;border-radius:999px;border:1px solid #ffffff22;background:#ffffff12;letter-spacing:.5px}
.wrap{max-width:820px;margin:auto;padding:12px}
.statusbar{display:flex;gap:8px;overflow:auto;padding:2px 0 10px;scrollbar-width:none}
.status{flex:0 0 auto;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:900;background:#fff;border:1px solid #ddd}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#aaa} .dot.on{background:#48b400} .dot.off{background:#d33131}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#fff;border-radius:18px;padding:15px;box-shadow:0 3px 15px #0000000b;min-width:0}
.card.total{grid-column:1/-1;background:#111;color:#fff}
.label{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;color:#777}
.total .label{color:#bbb}
.value{font-size:26px;font-weight:900;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.total .value{font-size:38px;color:var(--green)}
.payments{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.pay{background:#fff;border:1px solid #e7e7e1;border-radius:15px;padding:13px}
.pay span{display:block;color:#777;font-size:11px;font-weight:900;text-transform:uppercase} .pay b{display:block;margin-top:5px;font-size:18px}
.panel{background:#fff;border-radius:18px;padding:15px;margin-top:10px;box-shadow:0 3px 15px #0000000b}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.panel h2{font-size:19px;margin:0}
.refresh{border:0;background:#eee;border-radius:10px;padding:9px 10px;font-weight:900}
.order{border-top:1px solid #eee;padding:13px 0} .order:first-of-type{border-top:0}
.order-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.order-num{font-weight:900;font-size:18px} .order-total{font-weight:900;font-size:18px;white-space:nowrap}
.meta{color:#777;font-size:12px;margin-top:4px;line-height:1.4}
.reprint{margin-top:9px;border:0;background:#111;color:#fff;border-radius:9px;padding:8px 10px;font-weight:900;font-size:12px}
.empty{padding:26px 5px;text-align:center;color:#777}
.login{position:fixed;inset:0;background:#111;z-index:100;color:#fff;display:flex;align-items:center;justify-content:center;padding:22px}
.loginbox{width:100%;max-width:380px;text-align:center}
.loginlogo{font-size:38px;font-weight:900;font-style:italic} .loginlogo b{color:var(--green)}
.login p{color:#bbb;line-height:1.4}
.login input{width:100%;padding:14px;border:1px solid #333;border-radius:12px;background:#191919;color:#fff;text-align:center;font-size:22px;letter-spacing:5px;margin:10px 0}
.login button{width:100%;border:0;background:var(--green);border-radius:12px;padding:14px;font-weight:900;font-size:16px}
.err{color:#ff8686;font-size:13px;min-height:20px;margin-top:10px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#111;color:#fff;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:30}
.navin{width:100%;max-width:820px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nav button{border:0;border-radius:11px;padding:11px;font-weight:900} .nav .logout{background:#2a2a2a;color:#fff} .nav .reload{background:var(--green);color:#111}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(10px);background:#111;color:#fff;border-radius:999px;padding:10px 14px;font-weight:800;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:80;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:720px){.cards{grid-template-columns:repeat(3,1fr)}.card.total{grid-column:auto}.payments{grid-template-columns:repeat(5,1fr)}}
</style>
</head>
<body>
<header>
 <div class="head"><div class="logo"><b>NA</b> VIBE</div><div class="admin">ADMIN</div></div>
</header>

<main class="wrap">
  <div class="statusbar">
    <div class="status"><span class="dot" id="printerDot"></span><span id="printerText">Impressora...</span></div>
    <div class="status">Fila: <b id="pending">0</b></div>
    <div class="status" id="dayLabel">Hoje</div>
  </div>

  <section class="cards">
    <div class="card total"><div class="label">Total de hoje</div><div class="value" id="total">R$ 0,00</div></div>
    <div class="card"><div class="label">Pedidos impressos</div><div class="value" id="count">0</div></div>
    <div class="card"><div class="label">Ticket médio</div><div class="value" id="average">R$ 0,00</div></div>
  </section>

  <section class="payments">
    <div class="pay"><span>PIX</span><b id="pix">R$ 0,00</b></div>
    <div class="pay"><span>Dinheiro</span><b id="dinheiro">R$ 0,00</b></div>
    <div class="pay"><span>Crédito</span><b id="credito">R$ 0,00</b></div>
    <div class="pay"><span>Débito</span><b id="debito">R$ 0,00</b></div>
    <div class="pay"><span>Mesa</span><b id="mesa">R$ 0,00</b></div>
  </section>

  <section class="panel">
    <div class="panel-head"><h2>Últimos pedidos</h2><button class="refresh" id="refreshBtn">ATUALIZAR</button></div>
    <div id="orders"><div class="empty">Carregando...</div></div>
  </section>
</main>

<div class="nav">
  <div class="navin">
    <button class="logout" id="logoutBtn">SAIR</button>
    <button class="reload" id="reloadBtn">ATUALIZAR AGORA</button>
  </div>
</div>

<div class="login" id="login">
  <div class="loginbox">
    <div class="loginlogo"><b>NA</b> VIBE</div>
    <p>Painel administrativo</p>
    <input id="pin" inputmode="numeric" maxlength="8" placeholder="PIN">
    <button id="loginBtn">ENTRAR</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<div class="toast" id="toast">Atualizado</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbztHwzi7W9mMfVW9it7OuS35ESB11l92805P_cg5BEz7DWgQ8uIMfTr0rlQG8a9qvMZhg/exec";
let ADMIN_PIN=localStorage.getItem("navibe_admin_pin")||"";
let refreshTimer=null;

const money=n=>Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

function toast(msg){
 const t=document.getElementById("toast");
 t.textContent=msg;
 t.classList.add("show");
 clearTimeout(t._x);
 t._x=setTimeout(()=>t.classList.remove("show"),1800);
}

function jsonp(params){
 return new Promise((resolve,reject)=>{
   const cb="nv_"+Date.now()+"_"+Math.random().toString(36).slice(2);
   const s=document.createElement("script");
   let done=false;
   const finish=()=>{if(done)return;done=true;try{delete window[cb]}catch(e){};try{s.remove()}catch(e){};};
   const timer=setTimeout(()=>{finish();reject(new Error("tempo_esgotado"));},15000);
   window[cb]=data=>{clearTimeout(timer);finish();resolve(data);};
   s.onerror=()=>{clearTimeout(timer);finish();reject(new Error("falha_rede"));};
   const q=new URLSearchParams({...params,callback:cb,_:Date.now()});
   s.src=API_URL+"?"+q.toString();
   document.head.appendChild(s);
 });
}

function showLogin(message=""){
 document.getElementById("login").style.display="flex";
 document.getElementById("loginErr").textContent=message;
 document.getElementById("pin").value="";
 setTimeout(()=>document.getElementById("pin").focus(),100);
}

function hideLogin(){
 document.getElementById("login").style.display="none";
}

function render(data){
 document.getElementById("total").textContent=money(data.total);
 document.getElementById("count").textContent=data.count||0;
 document.getElementById("average").textContent=money(data.average);
 document.getElementById("pix").textContent=money(data.payments?.pix);
 document.getElementById("dinheiro").textContent=money(data.payments?.dinheiro);
 document.getElementById("credito").textContent=money(data.payments?.credito);
 document.getElementById("debito").textContent=money(data.payments?.debito);
 document.getElementById("mesa").textContent=money(data.payments?.mesa);
 document.getElementById("pending").textContent=data.pending||0;

 const dot=document.getElementById("printerDot");
 const txt=document.getElementById("printerText");
 dot.className="dot "+(data.printer?.online?"on":"off");
 txt.textContent=data.printer?.online?"Impressão online":"Impressão offline";

 if(data.day){
   const parts=data.day.split("-");
   document.getElementById("dayLabel").textContent=parts.length===3?`${parts[2]}/${parts[1]}/${parts[0]}`:"Hoje";
 }

 const box=document.getElementById("orders");
 const recent=data.recent||[];

 if(!recent.length){
   box.innerHTML='<div class="empty">Nenhum pedido registrado ainda.</div>';
   return;
 }

 box.innerHTML=recent.map(o=>`
   <div class="order">
     <div class="order-top">
       <div>
         <div class="order-num">Pedido #${esc(o.number||"—")}</div>
         <div class="meta">${esc(o.date||"")} • ${esc(o.time||"")}<br>${esc(o.source||"")}${o.client?" • "+esc(o.client):""}${o.waiter?" • Garçom: "+esc(o.waiter):""}<br>${esc(o.payment||"")}</div>
       </div>
       <div class="order-total">${money(o.total)}</div>
     </div>
     <button class="reprint" data-id="${esc(o.id)}">REIMPRIMIR</button>
   </div>
 `).join("");

 box.querySelectorAll("[data-id]").forEach(btn=>{
   btn.onclick=async()=>{
     if(!confirm("Reimprimir este pedido?"))return;
     btn.disabled=true;
     btn.textContent="ENVIANDO...";
     try{
       const data=await jsonp({action:"admin_reprint",pin:ADMIN_PIN,id:btn.dataset.id});
       if(!data.ok){
         if(data.error==="pin_invalido"){logout();return;}
         throw new Error(data.error||"erro");
       }
       toast("Pedido enviado para reimpressão");
       setTimeout(load,900);
     }catch(e){
       alert("Não consegui solicitar a reimpressão.");
     }finally{
       btn.disabled=false;
       btn.textContent="REIMPRIMIR";
     }
   };
 });
}

async function load(silent=false){
 if(!ADMIN_PIN){showLogin();return;}
 try{
   const data=await jsonp({action:"admin_summary",pin:ADMIN_PIN});
   if(!data.ok){
     if(data.error==="pin_invalido"){showLogin("PIN incorreto.");return;}
     throw new Error(data.error||"erro");
   }
   hideLogin();
   render(data);
   if(!silent)toast("Painel atualizado");
 }catch(e){
   if(!silent)toast("Falha ao atualizar");
 }
}

function logout(){
 ADMIN_PIN="";
 localStorage.removeItem("navibe_admin_pin");
 clearInterval(refreshTimer);
 showLogin();
}

document.getElementById("loginBtn").onclick=async()=>{
 const p=document.getElementById("pin").value.trim();
 if(!p){document.getElementById("loginErr").textContent="Digite o PIN.";return;}
 ADMIN_PIN=p;
 localStorage.setItem("navibe_admin_pin",p);
 document.getElementById("loginErr").textContent="Entrando...";
 try{
   const data=await jsonp({action:"admin_summary",pin:ADMIN_PIN});
   if(!data.ok){
     if(data.error==="pin_invalido")throw new Error("PIN incorreto");
     throw new Error("Erro");
   }
   hideLogin();
   render(data);
   clearInterval(refreshTimer);
   refreshTimer=setInterval(()=>load(true),5000);
 }catch(e){
   localStorage.removeItem("navibe_admin_pin");
   ADMIN_PIN="";
   document.getElementById("loginErr").textContent="PIN incorreto ou falha de conexão.";
 }
};

document.getElementById("pin").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("loginBtn").click();});
document.getElementById("logoutBtn").onclick=logout;
document.getElementById("reloadBtn").onclick=()=>load();
document.getElementById("refreshBtn").onclick=()=>load();

if(ADMIN_PIN){
 load(true);
 refreshTimer=setInterval(()=>load(true),5000);
}else{
 showLogin();
}
</script>
</body>
</html>
